aid: getharley
name: GetHarley
description: 'GetHarley is a UK-based telehealth and skincare platform delivering personalised, medical-grade
  skincare through online consultations. Patients answer questions about their skin concerns, book a video
  consultation, and are matched with one of a network of over 1,000 licensed dermatologists, aesthetic
  doctors, and plastic surgeons, who recommend a tailored regimen of medical-grade products delivered to
  the patient. GetHarley operates both a patient-facing storefront and a practitioner platform used by
  clinicians to manage recommendations, orders, and client relationships. Backed by Index Ventures, the
  company addresses concerns such as acne, fine lines, pigmentation, and ageing. As of this profile,
  GetHarley does not publish a public developer API, SDKs, or an MCP server; this record captures its
  identity, web properties, and probed domain-security posture for the API Evangelist network.'
